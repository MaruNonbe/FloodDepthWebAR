<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* カメラ映像 */
    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /*
      体験者が水中に入った時の全画面補正
      （水位が仮想目線 1.5m を超えたら徐々に強くする）
    */
    #globalUnderwater {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-out;
      background:
        linear-gradient(
          to bottom,
          rgba(210, 245, 255, 0.03),
          rgba(120, 220, 255, 0.14) 45%,
          rgba(70, 190, 245, 0.20) 100%
        );
      backdrop-filter: blur(1.3px) saturate(1.08);
    }

    /*
      浸水直方体全体
      体験者がその中心に立っている想定なので、
      水は左右いっぱいに広がる
    */
    #floodVolume {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28vh;
      z-index: 6;
      pointer-events: none;
      transition: height 0.18s ease-out;
    }

    /*
      水面以下の本体
      画面いっぱいに広げて「水に囲まれている」感じを出す
    */
    #floodBody {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          rgba(180, 238, 255, 0.12) 0%,
          rgba(120, 220, 250, 0.18) 22%,
          rgba(65, 190, 235, 0.26) 50%,
          rgba(30, 155, 220, 0.36) 78%,
          rgba(10, 120, 190, 0.48) 100%
        );

      box-shadow:
        inset 0 14px 18px rgba(255,255,255,0.04),
        inset 0 -18px 28px rgba(0,0,0,0.08);

      backdrop-filter: blur(1.6px) saturate(1.06);
    }

    /* 水中の淡い水色 */
    #underwaterTint {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(230, 248, 255, 0.05),
          rgba(140, 225, 255, 0.12) 35%,
          rgba(75, 195, 245, 0.18) 100%
        );
      mix-blend-mode: screen;
    }

    /* 水中のやわらかい霞 */
    #underwaterMist {
      position: absolute;
      inset: 0;
      background: rgba(145, 225, 255, 0.07);
      backdrop-filter: blur(1px);
    }

    /*
      水面そのもの
      前方だけの台形ではなく、体験者の周囲に広がる水面として
      横に広く、水平に見せる
    */
    #waterSurface {
      position: absolute;
      left: 0;
      right: 0;
      height: 14vh;
      top: -7vh;
      overflow: hidden;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.18) 0%,
          rgba(190, 240, 255, 0.16) 24%,
          rgba(115, 215, 245, 0.14) 55%,
          rgba(40, 165, 225, 0.12) 100%
        );

      box-shadow:
        0 0 20px rgba(220, 250, 255, 0.16),
        inset 0 10px 14px rgba(255,255,255,0.08);
    }

    /* 水面の明るい光だまり */
    #waterSurface .surfaceGlow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 35%,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.00) 42%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.00) 35%
        );
      opacity: 0.95;
    }

    /* 水面の白い反射ライン */
    #waterSurface .surfaceLine {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 62%;
      height: 4px;
      background: rgba(248, 255, 255, 0.96);
      border-radius: 999px;
      box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 0 20px rgba(180,235,255,0.85);
      animation: surfaceLineMove 2.8s ease-in-out infinite;
    }

    /* 波 */
    .waterWave {
      position: absolute;
      left: 3%;
      right: 3%;
      height: 28px;
      opacity: 0.95;
    }

    .waterWave1 {
      top: 50%;
      background:
        radial-gradient(ellipse at 8% 55%, rgba(255,255,255,0.84), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 24% 42%, rgba(255,255,255,0.60), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 42% 58%, rgba(255,255,255,0.72), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 62% 46%, rgba(255,255,255,0.64), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 82% 52%, rgba(255,255,255,0.78), rgba(255,255,255,0.0) 58%);
      animation: waveMove1 3.5s ease-in-out infinite;
    }

    .waterWave2 {
      top: 46%;
      opacity: 0.42;
      background:
        radial-gradient(ellipse at 16% 50%, rgba(255,255,255,0.52), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 46% 46%, rgba(255,255,255,0.46), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 74% 52%, rgba(255,255,255,0.50), rgba(255,255,255,0.0) 60%);
      animation: waveMove2 4.8s ease-in-out infinite;
    }

    /* 水面のキラキラ反射 */
    .waterRipple {
      position: absolute;
      inset: 0;
      opacity: 0.28;
    }

    .waterRipple1 {
      background:
        repeating-linear-gradient(
          165deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 18px,
          rgba(255,255,255,0.15) 24px,
          rgba(255,255,255,0.0) 34px
        );
      animation: shimmer1 5.5s linear infinite;
    }

    .waterRipple2 {
      background:
        repeating-linear-gradient(
          12deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 28px,
          rgba(255,255,255,0.08) 36px,
          rgba(255,255,255,0.0) 48px
        );
      opacity: 0.16;
      animation: shimmer2 7.0s linear infinite;
    }

    /* 上部説明 */
    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    /* 下部UI */
    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 20;
      color: white;
      background: rgba(0, 28, 48, 0.78);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    #presetButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.8;
      line-height: 1.45;
    }

    @keyframes surfaceLineMove {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(2px); }
      100% { transform: translateY(0); }
    }

    @keyframes waveMove1 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(22px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMove2 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-18px) translateY(2px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes shimmer1 {
      0%   { transform: translateX(-24px); }
      100% { transform: translateX(24px); }
    }

    @keyframes shimmer2 {
      0%   { transform: translateX(20px); }
      100% { transform: translateX(-20px); }
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="globalUnderwater"></div>

  <div id="floodVolume">
    <div id="floodBody">
      <div id="underwaterTint"></div>
      <div id="underwaterMist"></div>
    </div>

    <div id="waterSurface">
      <div class="surfaceGlow"></div>
      <div class="surfaceLine"></div>
      <div class="waterWave waterWave1"></div>
      <div class="waterWave waterWave2"></div>
      <div class="waterRipple waterRipple1"></div>
      <div class="waterRipple waterRipple2"></div>
    </div>
  </div>

  <div id="topBar">
    スマホを周囲に向けてください。<br>
    体験者が浸水域の中心に立っている想定で、水面が周囲に広がるように表示します。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">浸水深さWebARシミュレーション</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="debug">状態：カメラ起動前</div>

    <div id="basisInfo">
      基準：現在は簡易表示です。画面下側を床0mの仮基準とし、体験者が浸水直方体の中心に立っている想定で表示しています。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");
    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const floodVolume = document.getElementById("floodVolume");
    const globalUnderwater = document.getElementById("globalUnderwater");
    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    // 簡易的な仮想目線高さ（床から）
    const EYE_HEIGHT_METERS = 1.5;

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateFloodHeight() {
      const h = parseFloat(heightSlider.value);
      heightText.textContent = h.toFixed(1) + "m";

      /*
        画面下 = 床0m の仮基準
        0m〜5m を 10vh〜72vh に変換
      */
      const vh = Math.min(72, Math.max(10, 10 + (h / 5) * 62));
      floodVolume.style.height = vh + "vh";

      /*
        水位が仮想目線より高い場合は、
        体験者が水中に入った感じを全画面に少し加える
      */
      if (h <= EYE_HEIGHT_METERS) {
        globalUnderwater.style.opacity = "0";
      } else {
        const ratio = Math.min(1, (h - EYE_HEIGHT_METERS) / 2.5);
        const opacity = 0.08 + ratio * 0.28;
        globalUnderwater.style.opacity = opacity.toFixed(3);
      }
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 中心立ち位置版を表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateFloodHeight();
    }

    startButton.addEventListener("click", startCamera);
    heightSlider.addEventListener("input", updateFloodHeight);

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    updateFloodHeight();
  </script>
</body>
</html>
