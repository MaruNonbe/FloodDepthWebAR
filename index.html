<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* カメラ映像 */
    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* 全体の淡い水色補正 */
    #blueTint {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(80, 200, 255, 0.03),
        rgba(80, 200, 255, 0.10)
      );
    }

    /* 水面全体（遠近感を持たせた台形） */
    #waterPerspective {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 140vw;
      height: 28vh;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      overflow: hidden;

      clip-path: polygon(0% 100%, 100% 100%, 66% 0%, 34% 0%);

      background:
        linear-gradient(
          to bottom,
          rgba(210, 245, 255, 0.12) 0%,
          rgba(150, 230, 255, 0.20) 8%,
          rgba(95, 205, 245, 0.30) 18%,
          rgba(45, 170, 225, 0.42) 45%,
          rgba(18, 135, 205, 0.55) 72%,
          rgba(8, 95, 165, 0.68) 100%
        );

      box-shadow:
        0 -10px 26px rgba(180, 235, 255, 0.45),
        inset 0 18px 30px rgba(255,255,255,0.10);

      backdrop-filter: blur(1.6px) saturate(1.16);
      transition: height 0.18s ease-out;
    }

    /* 水面の明るい反射 */
    .waterShine {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 15%,
          rgba(255,255,255,0.34) 0%,
          rgba(255,255,255,0.0) 58%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.0) 24%
        );
      opacity: 0.85;
    }

    /* 水面境界の白い波 */
    .waterWave {
      position: absolute;
      left: -12%;
      right: -12%;
      top: -16px;
      height: 40px;
      opacity: 0.95;
    }

    .waterWave1 {
      background:
        radial-gradient(ellipse at 10% 55%, rgba(255,255,255,0.92), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 30% 42%, rgba(255,255,255,0.72), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 55% 58%, rgba(255,255,255,0.88), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 80% 48%, rgba(255,255,255,0.80), rgba(255,255,255,0.0) 58%);
      animation: waveMove1 3.6s ease-in-out infinite;
    }

    .waterWave2 {
      top: -10px;
      opacity: 0.45;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(255,255,255,0.62), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 45% 45%, rgba(255,255,255,0.55), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 75% 52%, rgba(255,255,255,0.62), rgba(255,255,255,0.0) 60%);
      animation: waveMove2 4.8s ease-in-out infinite;
    }

    /* 水面内の反射筋 */
    .waterRipple {
      position: absolute;
      inset: 0;
      opacity: 0.28;
    }

    .waterRipple1 {
      background:
        repeating-linear-gradient(
          165deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 24px,
          rgba(255,255,255,0.17) 30px,
          rgba(255,255,255,0.0) 42px
        );
      animation: shimmer1 6s linear infinite;
    }

    .waterRipple2 {
      background:
        repeating-linear-gradient(
          12deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 34px,
          rgba(255,255,255,0.10) 40px,
          rgba(255,255,255,0.0) 58px
        );
      opacity: 0.18;
      animation: shimmer2 8s linear infinite;
    }

    @keyframes waveMove1 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(26px) translateY(4px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMove2 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-20px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes shimmer1 {
      0%   { transform: translateX(-30px); }
      100% { transform: translateX(30px); }
    }

    @keyframes shimmer2 {
      0%   { transform: translateX(24px); }
      100% { transform: translateX(-24px); }
    }

    /* 上部説明 */
    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    /* 下部UI */
    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 20;
      color: white;
      background: rgba(0, 28, 48, 0.78);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    #presetButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.8;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="blueTint"></div>

  <div id="waterPerspective">
    <div class="waterShine"></div>
    <div class="waterWave waterWave1"></div>
    <div class="waterWave waterWave2"></div>
    <div class="waterRipple waterRipple1"></div>
    <div class="waterRipple waterRipple2"></div>
  </div>

  <div id="topBar">
    スマホを周囲に向けてください。<br>
    浸水高さを変えると、画面内の水面ラインが上下します。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">浸水深さWebARシミュレーション</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="debug">状態：カメラ起動前</div>
    <div id="basisInfo">
      基準：現在は簡易表示です。画面下側を地面0mの仮基準として、水面の高さを表示しています。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");
    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const waterPerspective = document.getElementById("waterPerspective");
    const blueTint = document.getElementById("blueTint");
    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateWaterHeight() {
      const h = parseFloat(heightSlider.value);
      heightText.textContent = h.toFixed(1) + "m";

      /*
        0m〜5m を画面内の水位に変換
        最低でも少し見えるように 8vh から開始
      */
      const percent = Math.min(88, Math.max(8, 8 + (h / 5) * 80));
      waterPerspective.style.height = percent + "vh";

      /*
        水深が深くなるほど、全体の青みを少し強める
      */
      const tintBottom = Math.min(0.22, 0.06 + h * 0.025);
      blueTint.style.background = `
        linear-gradient(
          to bottom,
          rgba(80, 200, 255, 0.03),
          rgba(80, 200, 255, ${tintBottom})
        )
      `;
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 水面表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateWaterHeight();
    }

    startButton.addEventListener("click", startCamera);
    heightSlider.addEventListener("input", updateWaterHeight);

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    updateWaterHeight();
  </script>
</body>
</html>
