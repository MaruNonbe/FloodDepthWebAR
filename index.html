<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR - High Quality Waterline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /*
      高水位時の全画面水中感
    */
    #globalUnderwater {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease-out;
      background:
        linear-gradient(
          to bottom,
          rgba(210, 245, 255, 0.02),
          rgba(120, 220, 255, 0.10) 45%,
          rgba(70, 190, 245, 0.16) 100%
        );
      backdrop-filter: blur(0.9px) saturate(1.05);
    }

    /*
      水面より下の領域
    */
    #underwaterArea {
      position: fixed;
      left: 0;
      right: 0;
      top: 60%;
      bottom: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
      transition: top 0.12s ease-out;
    }

    /*
      水中のベース色
    */
    #underwaterColor {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(120, 220, 255, 0.18) 0%,
          rgba(85, 205, 245, 0.28) 30%,
          rgba(40, 170, 230, 0.42) 70%,
          rgba(10, 110, 180, 0.52) 100%
        );
      backdrop-filter: blur(1px) saturate(1.08);
    }

    /*
      水中の霞
    */
    #underwaterMist {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(255,255,255,0.16) 0%,
          rgba(255,255,255,0.00) 55%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.06) 0%,
          rgba(255,255,255,0.00) 42%
        );
      opacity: 0.85;
    }

    /*
      水中のゆらぎ描画用
    */
    #causticsCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    /*
      水面帯
    */
    #waterSurfaceBand {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(60% - 44px);
      height: 88px;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
      transition: top 0.12s ease-out;
    }

    /*
      水面の薄い透明層
    */
    #surfaceGlass {
      position: absolute;
      left: 0;
      right: 0;
      top: 10px;
      bottom: 10px;
      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.04) 0%,
          rgba(180, 235, 255, 0.12) 35%,
          rgba(80, 190, 235, 0.10) 100%
        );
      opacity: 0.95;
    }

    /*
      水面の太陽反射
    */
    #surfaceHighlight {
      position: absolute;
      left: 10%;
      width: 80%;
      top: 8px;
      height: 60px;
      background:
        radial-gradient(
          ellipse at 50% 60%,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.14) 22%,
          rgba(255,255,255,0.00) 60%
        );
      opacity: 0.82;
      filter: blur(1px);
    }

    /*
      水面波描画用
    */
    #waterlineCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /*
      床ライン
    */
    #floorLine {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 230, 80, 0.72);
      z-index: 16;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 230, 80, 0.8);
    }

    #floorLabel {
      position: fixed;
      left: 12px;
      z-index: 17;
      pointer-events: none;
      color: #fff4a0;
      background: rgba(0,0,0,0.42);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    /*
      床合わせ用十字
    */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      z-index: 17;
      pointer-events: none;
      opacity: 0.85;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      border-radius: 999px;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 42px;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 42px;
      height: 2px;
      transform: translateY(-50%);
    }

    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 22;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 22;
      color: white;
      background: rgba(0, 28, 48, 0.82);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText,
    #scaleText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    button.sub {
      background: rgba(255,255,255,0.18);
    }

    #presetButtons,
    #floorButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.88;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.82;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="globalUnderwater"></div>

  <div id="underwaterArea">
    <div id="underwaterColor"></div>
    <div id="underwaterMist"></div>
    <canvas id="causticsCanvas"></canvas>
  </div>

  <div id="waterSurfaceBand">
    <div id="surfaceGlass"></div>
    <div id="surfaceHighlight"></div>
    <canvas id="waterlineCanvas"></canvas>
  </div>

  <div id="floorLine"></div>
  <div id="floorLabel">床 0m</div>
  <div id="crosshair"></div>

  <div id="topBar">
    画面中央の十字を床・地面に合わせて「床を中央に設定」を押してください。<br>
    水面ラインより上は通常、水面ラインより下は淡い水色の水中表現になります。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">床基準 浸水深さWebAR（高品質版）</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="floorButtons">
      <button id="setFloorButton">床を中央に設定</button>
      <button id="floorUpButton" class="sub">床↑</button>
      <button id="floorDownButton" class="sub">床↓</button>
    </div>

    <div class="row">
      <label for="scaleSlider">表示スケール</label>
      <input id="scaleSlider" type="range" min="60" max="220" step="5" value="120" />
      <div id="scaleText">120</div>
    </div>

    <div id="debug">状態：カメラ起動前</div>

    <div id="basisInfo">
      基準：床0mを手動設定し、そこから指定した浸水高さの水面ラインを表示します。<br>
      ※ブラウザ版のため、実測床検出ではなく、体験者が指定した床基準から水位を計算します。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");

    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");

    const scaleSlider = document.getElementById("scaleSlider");
    const scaleText = document.getElementById("scaleText");

    const underwaterArea = document.getElementById("underwaterArea");
    const waterSurfaceBand = document.getElementById("waterSurfaceBand");
    const globalUnderwater = document.getElementById("globalUnderwater");

    const floorLine = document.getElementById("floorLine");
    const floorLabel = document.getElementById("floorLabel");

    const setFloorButton = document.getElementById("setFloorButton");
    const floorUpButton = document.getElementById("floorUpButton");
    const floorDownButton = document.getElementById("floorDownButton");

    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    const waterlineCanvas = document.getElementById("waterlineCanvas");
    const causticsCanvas = document.getElementById("causticsCanvas");

    let floorY = Math.round(window.innerHeight * 0.72);
    let pixelsPerMeter = parseFloat(scaleSlider.value);
    const EYE_HEIGHT_METERS = 1.5;

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateFloorVisual() {
      floorLine.style.top = floorY + "px";
      floorLabel.style.top = Math.max(8, floorY - 26) + "px";
    }

    function updateFloodHeight() {
      const h = parseFloat(heightSlider.value);
      pixelsPerMeter = parseFloat(scaleSlider.value);

      heightText.textContent = h.toFixed(1) + "m";
      scaleText.textContent = String(Math.round(pixelsPerMeter));

      let waterSurfaceY = floorY - h * pixelsPerMeter;
      waterSurfaceY = Math.max(40, Math.min(window.innerHeight - 40, waterSurfaceY));

      underwaterArea.style.top = waterSurfaceY + "px";
      waterSurfaceBand.style.top = (waterSurfaceY - 44) + "px";

      if (h <= EYE_HEIGHT_METERS) {
        globalUnderwater.style.opacity = "0";
      } else {
        const ratio = Math.min(1, (h - EYE_HEIGHT_METERS) / 2.5);
        const opacity = 0.06 + ratio * 0.20;
        globalUnderwater.style.opacity = opacity.toFixed(3);
      }

      updateFloorVisual();
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateFloodHeight();
    }

    function setFloorToCenter() {
      floorY = Math.round(window.innerHeight / 2);
      setDebug("床0mを画面中央に設定しました");
      updateFloodHeight();
    }

    function moveFloor(deltaPx) {
      floorY = Math.round(Math.max(40, Math.min(window.innerHeight - 40, floorY + deltaPx)));
      setDebug("床0mラインを調整しました");
      updateFloodHeight();
    }

    function resizeCanvasToDisplaySize(canvas) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      return { width, height, ratio };
    }

    function drawWaterline(time) {
      const { width, height } = resizeCanvasToDisplaySize(waterlineCanvas);
      const ctx = waterlineCanvas.getContext("2d");
      if (!ctx) return;

      ctx.clearRect(0, 0, width, height);

      const t = time * 0.001;

      // ガラスっぽい薄い層
      const glassGrad = ctx.createLinearGradient(0, 0, 0, height);
      glassGrad.addColorStop(0, "rgba(255,255,255,0.06)");
      glassGrad.addColorStop(0.35, "rgba(160,220,255,0.10)");
      glassGrad.addColorStop(1, "rgba(70,180,235,0.08)");
      ctx.fillStyle = glassGrad;
      ctx.fillRect(0, height * 0.18, width, height * 0.50);

      // 太陽光の反射帯
      const shineGrad = ctx.createRadialGradient(
        width * 0.52, height * 0.40, 0,
        width * 0.52, height * 0.40, width * 0.30
      );
      shineGrad.addColorStop(0, "rgba(255,255,255,0.34)");
      shineGrad.addColorStop(0.25, "rgba(255,255,255,0.18)");
      shineGrad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = shineGrad;
      ctx.fillRect(0, 0, width, height);

      // 主水面ラインの波
      const baseY = height * 0.52;
      ctx.beginPath();
      for (let x = 0; x <= width; x += 4) {
        const y =
          baseY
          + Math.sin(x * 0.012 + t * 2.2) * 5
          + Math.sin(x * 0.026 + t * 1.3) * 2.5
          + Math.sin(x * 0.004 + t * 0.6) * 1.8;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(245,255,255,0.96)";
      ctx.shadowBlur = 10;
      ctx.shadowColor = "rgba(255,255,255,0.9)";
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 下側の青い縁
      ctx.beginPath();
      for (let x = 0; x <= width; x += 4) {
        const y =
          baseY + 4
          + Math.sin(x * 0.012 + t * 2.0) * 4
          + Math.sin(x * 0.026 + t * 1.1) * 2;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "rgba(120,220,255,0.55)";
      ctx.stroke();

      // 白い小さなハイライト
      for (let i = 0; i < 8; i++) {
        const px = ((i / 8) * width + (t * 30 * (i % 2 === 0 ? 1 : -1))) % width;
        const x = px < 0 ? px + width : px;
        const y =
          baseY - 8
          + Math.sin(x * 0.02 + t * 1.8) * 3;

        const g = ctx.createRadialGradient(x, y, 0, x, y, 26);
        g.addColorStop(0, "rgba(255,255,255,0.24)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCaustics(time) {
      const { width, height } = resizeCanvasToDisplaySize(causticsCanvas);
      const ctx = causticsCanvas.getContext("2d");
      if (!ctx) return;

      ctx.clearRect(0, 0, width, height);

      const t = time * 0.001;

      // 全体の薄い水中光
      const baseGrad = ctx.createLinearGradient(0, 0, 0, height);
      baseGrad.addColorStop(0, "rgba(255,255,255,0.08)");
      baseGrad.addColorStop(1, "rgba(255,255,255,0.00)");
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, width, height);

      // 波紋風ライン
      ctx.strokeStyle = "rgba(255,255,255,0.11)";
      ctx.lineWidth = 1.2;

      for (let j = 0; j < 9; j++) {
        const baseY = (j / 8) * height;
        ctx.beginPath();

        for (let x = 0; x <= width; x += 10) {
          const y =
            baseY
            + Math.sin(x * 0.018 + t * 1.6 + j * 0.9) * 8
            + Math.sin(x * 0.007 + t * 0.7 + j * 0.5) * 6;

          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();
      }

      // 斜めのキラキラ
      ctx.strokeStyle = "rgba(255,255,255,0.07)";
      for (let i = -height; i < width + height; i += 48) {
        ctx.beginPath();
        ctx.moveTo(i + Math.sin(t * 0.8) * 14, 0);
        ctx.lineTo(i - 80 + Math.sin(t * 0.8) * 14, height);
        ctx.stroke();
      }
    }

    function animate(time) {
      drawWaterline(time);
      drawCaustics(time);
      requestAnimationFrame(animate);
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 高品質水面表現を表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    startButton.addEventListener("click", startCamera);

    heightSlider.addEventListener("input", updateFloodHeight);
    scaleSlider.addEventListener("input", updateFloodHeight);

    setFloorButton.addEventListener("click", setFloorToCenter);
    floorUpButton.addEventListener("click", () => moveFloor(-12));
    floorDownButton.addEventListener("click", () => moveFloor(12));

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));   

    window.addEventListener("resize", () => {
      floorY = Math.round(Math.min(floorY, window.innerHeight - 40));
      updateFloodHeight();
    });

    updateFloorVisual();
    updateFloodHeight();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
