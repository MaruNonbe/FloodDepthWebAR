<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Debug</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #111111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      color: #003a5c;
    }

    .card {
      background: #f1f7fb;
      border: 1px solid #cfe4f2;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .ok {
      color: #007a3d;
      font-weight: 700;
    }

    .ng {
      color: #c00000;
      font-weight: 700;
    }

    .warn {
      color: #b36b00;
      font-weight: 700;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin: 8px 0;
      background: #008ee6;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    #camera {
      width: 100%;
      max-height: 55vh;
      background: #222;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      margin-top: 12px;
    }

    #log {
      white-space: pre-wrap;
      word-break: break-word;
      background: #111;
      color: #e9f7ff;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 120px;
    }

    #waterDemo {
      position: relative;
      height: 180px;
      overflow: hidden;
      background: linear-gradient(to bottom, #bfe8ff, #eaf8ff);
      border-radius: 12px;
      border: 1px solid #cfe4f2;
      margin-top: 12px;
    }

    #waterLayer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 45%;
      background: linear-gradient(
        to bottom,
        rgba(100, 210, 255, 0.45),
        rgba(20, 150, 220, 0.62)
      );
      border-top: 2px solid rgba(255,255,255,0.9);
    }

    #waterLayer::before {
      content: "";
      position: absolute;
      left: -20%;
      right: -20%;
      top: -18px;
      height: 34px;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.8), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.6), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 80% 55%, rgba(255,255,255,0.7), rgba(255,255,255,0) 60%);
      animation: wave 3s ease-in-out infinite;
    }

    @keyframes wave {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(24px) translateY(4px); }
      100% { transform: translateX(0) translateY(0); }
    }

    input[type="range"] {
      width: 100%;
    }
  </style>
</head>

<body>
  <h1>Flood Depth WebAR 診断版</h1>

  <div class="card">
    <div id="pageStatus">ページ読込中...</div>
  </div>

  <div class="card">
    <button id="cameraButton">カメラ起動テスト</button>
    <video id="camera" autoplay playsinline muted></video>
  </div>

  <div class="card">
    <div>浸水高さテスト：<span id="heightText">1.0m</span></div>
    <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />

    <div id="waterDemo">
      <div id="waterLayer"></div>
    </div>
  </div>

  <div class="card">
    <strong>診断ログ</strong>
    <div id="log"></div>
  </div>

  <script>
    const pageStatus = document.getElementById("pageStatus");
    const logBox = document.getElementById("log");
    const cameraButton = document.getElementById("cameraButton");
    const video = document.getElementById("camera");

    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const waterLayer = document.getElementById("waterLayer");

    function log(message) {
      const now = new Date().toLocaleTimeString();
      logBox.textContent += "[" + now + "] " + message + "\n";
      console.log(message);
    }

    window.addEventListener("error", function(event) {
      log("JS ERROR: " + event.message + " / " + event.filename + ":" + event.lineno);
    });

    window.addEventListener("unhandledrejection", function(event) {
      log("PROMISE ERROR: " + event.reason);
    });

    function checkPage() {
      pageStatus.innerHTML = "<span class='ok'>ページは読み込まれています。</span>";

      log("ページ読み込みOK");
      log("URL: " + location.href);
      log("protocol: " + location.protocol);
      log("host: " + location.host);
      log("userAgent: " + navigator.userAgent);

      if (location.protocol === "https:") {
        log("HTTPS: OK");
      } else if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        log("localhost: OK");
      } else {
        log("HTTPS: NG。カメラはHTTPSでないと起動できない可能性が高いです。");
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        log("getUserMedia: OK");
      } else {
        log("getUserMedia: NG。このブラウザではカメラAPIが使えません。");
      }

      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: "camera" })
          .then(function(result) {
            log("camera permission state: " + result.state);
          })
          .catch(function(error) {
            log("camera permission query failed: " + error.name);
          });
      } else {
        log("Permissions API: 使用不可。ただしSafariでは普通です。");
      }
    }

    async function startCamera() {
      log("カメラ起動ボタンが押されました。");

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          log("カメラAPIがありません。");
          alert("このブラウザはカメラAPIに対応していません。SafariまたはChromeで開いてください。");
          return;
        }

        const constraints = {
          video: {
            facingMode: "environment"
          },
          audio: false
        };

        log("getUserMedia開始");

        const stream = await navigator.mediaDevices.getUserMedia(constraints);

        log("getUserMedia成功");

        video.srcObject = stream;

        video.onloadedmetadata = function() {
          log("video metadata loaded");
          video.play()
            .then(function() {
              log("video play OK");
              pageStatus.innerHTML = "<span class='ok'>カメラ起動OKです。</span>";
            })
            .catch(function(error) {
              log("video play error: " + error.name + " / " + error.message);
            });
        };

      } catch (error) {
        log("カメラ起動失敗: " + error.name + " / " + error.message);

        let message = "カメラ起動に失敗しました。";

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません。ブラウザ設定でカメラ許可を確認してください。";
        }

        if (error.name === "NotFoundError") {
          message = "カメラが見つかりません。別の端末またはブラウザで確認してください。";
        }

        if (error.name === "NotReadableError") {
          message = "他のアプリがカメラを使用中の可能性があります。カメラアプリ等を閉じてください。";
        }

        pageStatus.innerHTML = "<span class='ng'>" + message + "</span>";
        alert(message + "\n\n" + error.name + "\n" + error.message);
      }
    }

    function updateWaterHeight() {
      const h = parseFloat(heightSlider.value);
      heightText.textContent = h.toFixed(1) + "m";

      const percent = Math.min(95, Math.max(0, h / 5 * 95));
      waterLayer.style.height = percent + "%";
    }

    cameraButton.addEventListener("click", startCamera);
    heightSlider.addEventListener("input", updateWaterHeight);

    checkPage();
    updateWaterHeight();
  </script>
</body>
</html>
