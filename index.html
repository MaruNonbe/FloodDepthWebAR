<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator - Floor Based</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* 水位が高いとき、水中に入った感じを出す */
    #globalUnderwater {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease-out;
      background:
        linear-gradient(
          to bottom,
          rgba(210, 245, 255, 0.03),
          rgba(120, 220, 255, 0.14) 45%,
          rgba(70, 190, 245, 0.22) 100%
        );
      backdrop-filter: blur(1.2px) saturate(1.08);
    }

    /* 床0mライン */
    #floorLine {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 240, 120, 0.95);
      z-index: 18;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(255, 240, 120, 0.9);
    }

    #floorLabel {
      position: fixed;
      left: 14px;
      z-index: 19;
      pointer-events: none;
      color: #fff6a0;
      background: rgba(0,0,0,0.45);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* 画面中央の床合わせ用十字 */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      z-index: 17;
      pointer-events: none;
      opacity: 0.85;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      border-radius: 999px;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 42px;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 42px;
      height: 2px;
      transform: translateY(-50%);
    }

    /* 床基準から立ち上がる水の直方体 */
    #floodVolume {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      bottom: 0;
      z-index: 6;
      pointer-events: none;
      overflow: visible;
      transition: top 0.12s ease-out;
    }

    #floodBody {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          rgba(180, 238, 255, 0.12) 0%,
          rgba(120, 220, 250, 0.18) 22%,
          rgba(65, 190, 235, 0.28) 50%,
          rgba(30, 155, 220, 0.40) 78%,
          rgba(10, 120, 190, 0.52) 100%
        );

      backdrop-filter: blur(1.4px) saturate(1.08);

      box-shadow:
        inset 0 14px 18px rgba(255,255,255,0.05),
        inset 0 -18px 28px rgba(0,0,0,0.08);
    }

    #underwaterTint {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(230, 248, 255, 0.05),
          rgba(140, 225, 255, 0.13) 35%,
          rgba(75, 195, 245, 0.20) 100%
        );
      mix-blend-mode: screen;
    }

    #underwaterMist {
      position: absolute;
      inset: 0;
      background: rgba(145, 225, 255, 0.07);
      backdrop-filter: blur(1px);
    }

    /* 直方体の上面＝水面 */
    #waterSurface {
      position: absolute;
      left: 0;
      right: 0;
      height: 14vh;
      top: -7vh;
      overflow: hidden;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.18) 0%,
          rgba(190, 240, 255, 0.16) 24%,
          rgba(115, 215, 245, 0.14) 55%,
          rgba(40, 165, 225, 0.12) 100%
        );

      box-shadow:
        0 0 20px rgba(220, 250, 255, 0.18),
        inset 0 10px 14px rgba(255,255,255,0.08);
    }

    #waterSurface .surfaceGlow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 35%,
          rgba(255,255,255,0.46) 0%,
          rgba(255,255,255,0.00) 42%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.12),
          rgba(255,255,255,0.00) 35%
        );
      opacity: 0.95;
    }

    #waterSurface .surfaceLine {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 62%;
      height: 4px;
      background: rgba(248, 255, 255, 0.96);
      border-radius: 999px;
      box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 0 20px rgba(180,235,255,0.85);
      animation: surfaceLineMove 2.8s ease-in-out infinite;
    }

    .waterWave {
      position: absolute;
      left: 3%;
      right: 3%;
      height: 28px;
      opacity: 0.95;
    }

    .waterWave1 {
      top: 50%;
      background:
        radial-gradient(ellipse at 8% 55%, rgba(255,255,255,0.84), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 24% 42%, rgba(255,255,255,0.60), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 42% 58%, rgba(255,255,255,0.72), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 62% 46%, rgba(255,255,255,0.64), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 82% 52%, rgba(255,255,255,0.78), rgba(255,255,255,0.0) 58%);
      animation: waveMove1 3.5s ease-in-out infinite;
    }

    .waterWave2 {
      top: 46%;
      opacity: 0.42;
      background:
        radial-gradient(ellipse at 16% 50%, rgba(255,255,255,0.52), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 46% 46%, rgba(255,255,255,0.46), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 74% 52%, rgba(255,255,255,0.50), rgba(255,255,255,0.0) 60%);
      animation: waveMove2 4.8s ease-in-out infinite;
    }

    .waterRipple {
      position: absolute;
      inset: 0;
      opacity: 0.28;
    }

    .waterRipple1 {
      background:
        repeating-linear-gradient(
          165deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 18px,
          rgba(255,255,255,0.15) 24px,
          rgba(255,255,255,0.0) 34px
        );
      animation: shimmer1 5.5s linear infinite;
    }

    .waterRipple2 {
      background:
        repeating-linear-gradient(
          12deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 28px,
          rgba(255,255,255,0.08) 36px,
          rgba(255,255,255,0.0) 48px
        );
      opacity: 0.16;
      animation: shimmer2 7.0s linear infinite;
    }

    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 20;
      color: white;
      background: rgba(0, 28, 48, 0.80);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText,
    #scaleText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    button.sub {
      background: rgba(255,255,255,0.18);
    }

    #presetButtons,
    #floorButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.88;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.82;
      line-height: 1.45;
    }

    @keyframes surfaceLineMove {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(2px); }
      100% { transform: translateY(0); }
    }

    @keyframes waveMove1 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(22px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMove2 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-18px) translateY(2px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes shimmer1 {
      0%   { transform: translateX(-24px); }
      100% { transform: translateX(24px); }
    }

    @keyframes shimmer2 {
      0%   { transform: translateX(20px); }
      100% { transform: translateX(-20px); }
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="globalUnderwater"></div>

  <div id="floorLine"></div>
  <div id="floorLabel">床 0m</div>
  <div id="crosshair"></div>

  <div id="floodVolume">
    <div id="floodBody">
      <div id="underwaterTint"></div>
      <div id="underwaterMist"></div>
    </div>

    <div id="waterSurface">
      <div class="surfaceGlow"></div>
      <div class="surfaceLine"></div>
      <div class="waterWave waterWave1"></div>
      <div class="waterWave waterWave2"></div>
      <div class="waterRipple waterRipple1"></div>
      <div class="waterRipple waterRipple2"></div>
    </div>
  </div>

  <div id="topBar">
    画面中央の十字を床・地面に合わせて「床を中央に設定」を押してください。<br>
    その床0mから指定した浸水高さの水面を表示します。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">床基準 浸水深さWebAR</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="floorButtons">
      <button id="setFloorButton">床を中央に設定</button>
      <button id="floorUpButton" class="sub">床↑</button>
      <button id="floorDownButton" class="sub">床↓</button>
    </div>

    <div class="row">
      <label for="scaleSlider">表示スケール</label>
      <input id="scaleSlider" type="range" min="60" max="220" step="5" value="120" />
      <div id="scaleText">120</div>
    </div>

    <div id="debug">状態：カメラ起動前</div>

    <div id="basisInfo">
      基準：画面中央の十字を床に合わせて設定した位置を「床0m」とします。<br>
      ※ブラウザ版のため、実測床検出ではなく、体験者が指定した床基準から水位を計算する方式です。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");

    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");

    const scaleSlider = document.getElementById("scaleSlider");
    const scaleText = document.getElementById("scaleText");

    const floodVolume = document.getElementById("floodVolume");
    const globalUnderwater = document.getElementById("globalUnderwater");

    const floorLine = document.getElementById("floorLine");
    const floorLabel = document.getElementById("floorLabel");

    const setFloorButton = document.getElementById("setFloorButton");
    const floorUpButton = document.getElementById("floorUpButton");
    const floorDownButton = document.getElementById("floorDownButton");

    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    /*
      初期床位置。
      画面下寄りを仮の床0mにしておく。
      ユーザーが「床を中央に設定」を押すと更新される。
    */
    let floorY = Math.round(window.innerHeight * 0.72);

    /*
      1mあたり何px上に水面を上げるか。
      端末・構図によって見え方が変わるので調整可能にする。
    */
    let pixelsPerMeter = parseFloat(scaleSlider.value);

    /*
      水中に入った感じを出すための仮想目線高さ。
    */
    const EYE_HEIGHT_METERS = 1.5;

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateFloorVisual() {
      floorLine.style.top = floorY + "px";
      floorLabel.style.top = Math.max(8, floorY - 26) + "px";
    }

    function updateFloodHeight() {
      const h = parseFloat(heightSlider.value);
      pixelsPerMeter = parseFloat(scaleSlider.value);

      heightText.textContent = h.toFixed(1) + "m";
      scaleText.textContent = String(Math.round(pixelsPerMeter));

      /*
        床0mから指定水位分だけ上に水面を出す。
        waterSurfaceY が水面位置。
      */
      let waterSurfaceY = floorY - h * pixelsPerMeter;

      /*
        画面外に行き過ぎないように少しだけ制限。
      */
      waterSurfaceY = Math.max(-80, Math.min(window.innerHeight + 40, waterSurfaceY));

      floodVolume.style.top = waterSurfaceY + "px";

      /*
        水位が目線より高い場合は、全体を水中っぽくする。
      */
      if (h <= EYE_HEIGHT_METERS) {
        globalUnderwater.style.opacity = "0";
      } else {
        const ratio = Math.min(1, (h - EYE_HEIGHT_METERS) / 2.5);
        const opacity = 0.08 + ratio * 0.28;
        globalUnderwater.style.opacity = opacity.toFixed(3);
      }

      updateFloorVisual();
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateFloodHeight();
    }

    function setFloorToCenter() {
      floorY = Math.round(window.innerHeight / 2);
      setDebug("床0mを画面中央に設定しました");
      updateFloodHeight();
    }

    function moveFloor(deltaPx) {
      floorY = Math.round(Math.max(40, Math.min(window.innerHeight - 40, floorY + deltaPx)));
      setDebug("床0mラインを調整しました");
      updateFloodHeight();
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 床基準版を表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    startButton.addEventListener("click", startCamera);

    heightSlider.addEventListener("input", updateFloodHeight);
    scaleSlider.addEventListener("input", updateFloodHeight);

    setFloorButton.addEventListener("click", setFloorToCenter);
    floorUpButton.addEventListener("click", () => moveFloor(-12));
    floorDownButton.addEventListener("click", () => moveFloor(12));

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    window.addEventListener("resize", () => {
      floorY = Math.round(Math.min(floorY, window.innerHeight - 40));
      updateFloodHeight();
    });

    updateFloorVisual();
    updateFloodHeight();
  </script>
</body>
</html>
