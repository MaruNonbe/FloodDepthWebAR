<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* カメラ映像 */
    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* 浸水直方体全体 */
    #floodVolume {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28vh;
      z-index: 6;
      pointer-events: none;
      transition: height 0.18s ease-out;
    }

    /* 水面以下の直方体本体 */
    #floodBody {
      position: absolute;
      left: 4vw;
      right: 4vw;
      bottom: 0;
      top: 0;
      overflow: hidden;
      border-left: 1px solid rgba(210, 245, 255, 0.25);
      border-right: 1px solid rgba(210, 245, 255, 0.25);

      background:
        linear-gradient(
          to bottom,
          rgba(170, 235, 255, 0.18) 0%,
          rgba(100, 210, 245, 0.24) 18%,
          rgba(55, 180, 230, 0.32) 48%,
          rgba(25, 145, 210, 0.42) 76%,
          rgba(8, 110, 180, 0.56) 100%
        );

      box-shadow:
        inset 0 12px 20px rgba(255,255,255,0.06),
        inset 0 -16px 24px rgba(0,0,0,0.08);

      backdrop-filter: blur(1.4px) saturate(1.08);
    }

    /* 水中の淡い水色感 */
    #underwaterTint {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(210, 245, 255, 0.05),
          rgba(120, 220, 255, 0.12) 35%,
          rgba(60, 185, 240, 0.18) 100%
        );
      mix-blend-mode: screen;
    }

    /* 水中のやわらかい霞 */
    #underwaterMist {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background: rgba(140, 225, 255, 0.08);
      backdrop-filter: blur(1.1px);
    }

    /* 水面の直方体上面 */
    #waterTop {
      position: absolute;
      left: 8vw;
      right: 8vw;
      height: 15vh;
      top: -8vh;
      overflow: hidden;
      pointer-events: none;

      /* 直方体上面っぽい台形 */
      clip-path: polygon(0% 100%, 100% 100%, 82% 0%, 18% 0%);

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.32) 0%,
          rgba(185, 240, 255, 0.24) 18%,
          rgba(110, 215, 245, 0.22) 45%,
          rgba(40, 165, 225, 0.26) 100%
        );

      box-shadow:
        0 0 22px rgba(230, 250, 255, 0.28),
        inset 0 10px 16px rgba(255,255,255,0.12);
    }

    /* 水面の反射 */
    #waterTop .surfaceGlow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 52% 22%,
          rgba(255,255,255,0.52) 0%,
          rgba(255,255,255,0.0) 48%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.14),
          rgba(255,255,255,0.0) 35%
        );
      opacity: 0.95;
    }

    /* 水面の強い白いライン */
    #waterTop .surfaceLine {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 58%;
      height: 4px;
      background: rgba(248, 255, 255, 0.95);
      border-radius: 999px;
      box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 0 20px rgba(180,235,255,0.9);
      animation: surfaceLineMove 2.8s ease-in-out infinite;
    }

    /* 白い波 */
    .waterWave {
      position: absolute;
      left: 4%;
      right: 4%;
      height: 26px;
      opacity: 0.95;
    }

    .waterWave1 {
      top: 48%;
      background:
        radial-gradient(ellipse at 10% 55%, rgba(255,255,255,0.84), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 28% 44%, rgba(255,255,255,0.62), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 52% 58%, rgba(255,255,255,0.74), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 78% 48%, rgba(255,255,255,0.68), rgba(255,255,255,0.0) 58%);
      animation: waveMove1 3.6s ease-in-out infinite;
    }

    .waterWave2 {
      top: 44%;
      opacity: 0.45;
      background:
        radial-gradient(ellipse at 18% 50%, rgba(255,255,255,0.52), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 48% 46%, rgba(255,255,255,0.48), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 74% 52%, rgba(255,255,255,0.52), rgba(255,255,255,0.0) 60%);
      animation: waveMove2 4.8s ease-in-out infinite;
    }

    /* 水面上の反射筋 */
    .waterRipple {
      position: absolute;
      inset: 0;
      opacity: 0.30;
    }

    .waterRipple1 {
      background:
        repeating-linear-gradient(
          165deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 20px,
          rgba(255,255,255,0.16) 25px,
          rgba(255,255,255,0.0) 36px
        );
      animation: shimmer1 5.5s linear infinite;
    }

    .waterRipple2 {
      background:
        repeating-linear-gradient(
          12deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 30px,
          rgba(255,255,255,0.10) 36px,
          rgba(255,255,255,0.0) 50px
        );
      opacity: 0.18;
      animation: shimmer2 7.5s linear infinite;
    }

    /* 上部説明 */
    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    /* 下部UI */
    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 20;
      color: white;
      background: rgba(0, 28, 48, 0.78);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    #presetButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.8;
      line-height: 1.4;
    }

    @keyframes surfaceLineMove {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(2px); }
      100% { transform: translateY(0); }
    }

    @keyframes waveMove1 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(22px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMove2 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-18px) translateY(2px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes shimmer1 {
      0%   { transform: translateX(-24px); }
      100% { transform: translateX(24px); }
    }

    @keyframes shimmer2 {
      0%   { transform: translateX(20px); }
      100% { transform: translateX(-20px); }
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="floodVolume">
    <div id="floodBody">
      <div id="underwaterTint"></div>
      <div id="underwaterMist"></div>
    </div>

    <div id="waterTop">
      <div class="surfaceGlow"></div>
      <div class="surfaceLine"></div>
      <div class="waterWave waterWave1"></div>
      <div class="waterWave waterWave2"></div>
      <div class="waterRipple waterRipple1"></div>
      <div class="waterRipple waterRipple2"></div>
    </div>
  </div>

  <div id="topBar">
    スマホを周囲に向けてください。<br>
    浸水高さを変えると、床からの浸水高さを想定した直方体状の水塊が上下します。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">浸水深さWebARシミュレーション</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="debug">状態：カメラ起動前</div>

    <div id="basisInfo">
      基準：現在は簡易表示です。画面下側を床0mの仮基準として、浸水高さを表示しています。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");
    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const floodVolume = document.getElementById("floodVolume");
    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateFloodHeight() {
      const h = parseFloat(heightSlider.value);
      heightText.textContent = h.toFixed(1) + "m";

      /*
        簡易版:
        0m〜5m を 12vh〜70vh に変換
        画面下 = 床0m の仮基準
      */
      const vh = Math.min(70, Math.max(12, 12 + (h / 5) * 58));
      floodVolume.style.height = vh + "vh";
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 浸水直方体表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateFloodHeight();
    }

    startButton.addEventListener("click", startCamera);
    heightSlider.addEventListener("input", updateFloodHeight);

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    updateFloodHeight();
  </script>
</body>
</html>
