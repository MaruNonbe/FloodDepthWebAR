<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* カメラ映像 */
    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* 画面全体の淡い水色補正 */
    #blueTint {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(80, 200, 255, 0.03),
        rgba(80, 200, 255, 0.10)
      );
    }

    /* 水面全体：横に広がる洪水面 */
    #waterPerspective {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 150vw;
      height: 32vh;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      overflow: hidden;

      /*
        上側を広めにして、
        水色の「壁」ではなく「水面」に見えやすくする
      */
      clip-path: polygon(0% 100%, 100% 100%, 76% 0%, 24% 0%);

      background:
        linear-gradient(
          to bottom,
          rgba(235, 252, 255, 0.18) 0%,
          rgba(160, 232, 255, 0.26) 10%,
          rgba(80, 200, 240, 0.34) 35%,
          rgba(35, 165, 225, 0.46) 65%,
          rgba(10, 120, 190, 0.58) 100%
        );

      box-shadow:
        0 -6px 18px rgba(220, 250, 255, 0.55),
        inset 0 16px 28px rgba(255,255,255,0.12);

      backdrop-filter: blur(0.7px) saturate(1.08);
      transition: height 0.18s ease-out;
    }

    /* 水面の上端をはっきり見せる白いライン */
    #waterPerspective::before {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      top: 0;
      height: 5px;
      background: rgba(245, 255, 255, 0.95);
      box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 6px 18px rgba(160,230,255,0.75);
      border-radius: 999px;
      z-index: 6;
      animation: surfaceLineMove 2.8s ease-in-out infinite;
    }

    /* 水面の明るい反射 */
    .waterShine {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 12%,
          rgba(255,255,255,0.36) 0%,
          rgba(255,255,255,0.0) 48%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.16),
          rgba(255,255,255,0.0) 30%
        );
      opacity: 0.9;
      z-index: 2;
    }

    /* 水面境界付近の白い波 */
    .waterWave {
      position: absolute;
      left: 5%;
      right: 5%;
      top: -15px;
      height: 34px;
      opacity: 0.9;
      z-index: 7;
    }

    .waterWave1 {
      background:
        radial-gradient(ellipse at 10% 55%, rgba(255,255,255,0.90), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 30% 42%, rgba(255,255,255,0.66), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 55% 58%, rgba(255,255,255,0.82), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 80% 48%, rgba(255,255,255,0.74), rgba(255,255,255,0.0) 58%);
      animation: waveMove1 3.6s ease-in-out infinite;
    }

    .waterWave2 {
      top: -8px;
      opacity: 0.45;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(255,255,255,0.58), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 45% 45%, rgba(255,255,255,0.50), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 75% 52%, rgba(255,255,255,0.58), rgba(255,255,255,0.0) 60%);
      animation: waveMove2 4.8s ease-in-out infinite;
    }

    /* 水面上の奥行き方向の波線 */
    .waterRipple {
      position: absolute;
      inset: 0;
      opacity: 0.34;
      z-index: 3;
    }

    .waterRipple1 {
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.00) 0px,
          rgba(255,255,255,0.00) 22px,
          rgba(255,255,255,0.20) 24px,
          rgba(255,255,255,0.00) 30px
        );
      transform: perspective(300px) rotateX(58deg) scaleX(1.2);
      transform-origin: top center;
      animation: rippleForward 4.5s linear infinite;
    }

    .waterRipple2 {
      background:
        repeating-linear-gradient(
          165deg,
          rgba(255,255,255,0.00) 0px,
          rgba(255,255,255,0.00) 26px,
          rgba(255,255,255,0.12) 31px,
          rgba(255,255,255,0.00) 44px
        );
      opacity: 0.20;
      animation: shimmer2 7s linear infinite;
    }

    @keyframes surfaceLineMove {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(2px); }
      100% { transform: translateY(0); }
    }

    @keyframes waveMove1 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(24px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMove2 {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-18px) translateY(2px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes rippleForward {
      0%   { background-position-y: 0px; }
      100% { background-position-y: 60px; }
    }

    @keyframes shimmer2 {
      0%   { transform: translateX(24px); }
      100% { transform: translateX(-24px); }
    }

    /* 上部説明 */
    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    /* 下部UI */
    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 20;
      color: white;
      background: rgba(0, 28, 48, 0.78);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    #presetButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.8;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="blueTint"></div>

  <div id="waterPerspective">
    <div class="waterShine"></div>
    <div class="waterWave waterWave1"></div>
    <div class="waterWave waterWave2"></div>
    <div class="waterRipple waterRipple1"></div>
    <div class="waterRipple waterRipple2"></div>
  </div>

  <div id="topBar">
    スマホを周囲に向けてください。<br>
    浸水高さを変えると、画面内の水面ラインが上下します。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">浸水深さWebARシミュレーション</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="debug">状態：カメラ起動前</div>

    <div id="basisInfo">
      基準：現在は簡易表示です。画面下側を地面0mの仮基準として、水面の高さを表示しています。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");
    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const waterPerspective = document.getElementById("waterPerspective");
    const blueTint = document.getElementById("blueTint");
    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateWaterHeight() {
      const h = parseFloat(heightSlider.value);
      heightText.textContent = h.toFixed(1) + "m";

      /*
        水面が高くなりすぎると「壁」に見えるため、
        最大を少し抑えて、横に広がる水面として見せる。
        0m〜5mを 12vh〜68vh に変換。
      */
      const percent = Math.min(68, Math.max(12, 12 + (h / 5) * 56));
      waterPerspective.style.height = percent + "vh";

      /*
        水深が深くなるほど、全体の青みを少し強める。
      */
      const tintBottom = Math.min(0.22, 0.06 + h * 0.025);

      blueTint.style.background = `
        linear-gradient(
          to bottom,
          rgba(80, 200, 255, 0.03),
          rgba(80, 200, 255, ${tintBottom})
        )
      `;
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 水面表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateWaterHeight();
    }

    startButton.addEventListener("click", startCamera);
    heightSlider.addEventListener("input", updateWaterHeight);

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    updateWaterHeight();
  </script>
</body>
</html>
