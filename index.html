<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator - Waterline View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /*
      水面より下の領域。
      画像のように、下側だけ淡い水色に染める。
    */
    #underwaterArea {
      position: fixed;
      left: 0;
      right: 0;
      top: 60%;
      bottom: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          rgba(120, 220, 255, 0.22) 0%,
          rgba(80, 200, 245, 0.34) 32%,
          rgba(35, 165, 225, 0.48) 70%,
          rgba(10, 110, 180, 0.58) 100%
        );

      backdrop-filter: blur(1.1px) saturate(1.12);
      transition: top 0.12s ease-out;
    }

    /*
      水中の光のゆらぎ・屈折風の模様
    */
    #underwaterArea::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        repeating-linear-gradient(
          160deg,
          rgba(255,255,255,0.00) 0px,
          rgba(255,255,255,0.00) 28px,
          rgba(255,255,255,0.16) 34px,
          rgba(255,255,255,0.00) 48px
        ),
        repeating-linear-gradient(
          25deg,
          rgba(255,255,255,0.00) 0px,
          rgba(255,255,255,0.00) 42px,
          rgba(255,255,255,0.10) 50px,
          rgba(255,255,255,0.00) 66px
        );
      opacity: 0.38;
      animation: causticsMove 7s linear infinite;
    }

    /*
      水中の遠くが少し白っぽく霞む感じ
    */
    #underwaterArea::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 10%,
          rgba(255,255,255,0.18) 0%,
          rgba(255,255,255,0.00) 48%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.00) 55%
        );
      opacity: 0.78;
    }

    /*
      水面ライン周辺。
      画像の中央にある、波立った境界線。
    */
    #waterSurfaceBand {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(60% - 42px);
      height: 84px;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
      transition: top 0.12s ease-out;
    }

    /*
      水面の透明な板。
      少しだけ上下に厚みを持たせる。
    */
    .surfaceGlass {
      position: absolute;
      left: -5%;
      right: -5%;
      top: 18px;
      height: 50px;
      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.08) 0%,
          rgba(180,235,255,0.22) 42%,
          rgba(80,190,235,0.20) 100%
        );
      opacity: 0.95;
      filter: blur(0.2px);
    }

    /*
      水面のメイン白線。
      画像のように、ここを一番目立たせる。
    */
    .surfaceLine {
      position: absolute;
      left: -8%;
      right: -8%;
      top: 40px;
      height: 5px;
      background: rgba(245,255,255,0.95);
      border-radius: 999px;
      box-shadow:
        0 0 10px rgba(255,255,255,0.95),
        0 4px 18px rgba(150,230,255,0.85),
        0 -4px 12px rgba(255,255,255,0.55);
      animation: surfaceLineWave 3.2s ease-in-out infinite;
    }

    /*
      水面の波の凹凸。
    */
    .surfaceWave1,
    .surfaceWave2 {
      position: absolute;
      left: -12%;
      right: -12%;
      height: 34px;
      top: 26px;
      opacity: 0.8;
    }

    .surfaceWave1 {
      background:
        radial-gradient(ellipse at 8% 52%, rgba(255,255,255,0.72), rgba(255,255,255,0) 58%),
        radial-gradient(ellipse at 22% 44%, rgba(255,255,255,0.48), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 40% 57%, rgba(255,255,255,0.62), rgba(255,255,255,0) 58%),
        radial-gradient(ellipse at 58% 46%, rgba(255,255,255,0.54), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 78% 55%, rgba(255,255,255,0.68), rgba(255,255,255,0) 58%);
      animation: waveMoveA 4s ease-in-out infinite;
    }

    .surfaceWave2 {
      top: 34px;
      opacity: 0.45;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(255,255,255,0.48), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 45% 48%, rgba(255,255,255,0.40), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 72% 54%, rgba(255,255,255,0.46), rgba(255,255,255,0) 60%);
      animation: waveMoveB 5.3s ease-in-out infinite;
    }

    /*
      太陽光の反射。
    */
    .surfaceShine {
      position: absolute;
      left: -10%;
      right: -10%;
      top: 12px;
      height: 56px;
      background:
        radial-gradient(
          ellipse at 54% 50%,
          rgba(255,255,255,0.46) 0%,
          rgba(255,255,255,0.18) 28%,
          rgba(255,255,255,0.00) 62%
        ),
        repeating-linear-gradient(
          170deg,
          rgba(255,255,255,0.00) 0px,
          rgba(255,255,255,0.00) 24px,
          rgba(255,255,255,0.16) 30px,
          rgba(255,255,255,0.00) 42px
        );
      opacity: 0.72;
      animation: shineMove 6s linear infinite;
    }

    /*
      床0mライン。通常は邪魔なので薄め。
    */
    #floorLine {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 230, 80, 0.72);
      z-index: 16;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(255, 230, 80, 0.8);
    }

    #floorLabel {
      position: fixed;
      left: 12px;
      z-index: 17;
      pointer-events: none;
      color: #fff4a0;
      background: rgba(0,0,0,0.42);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    /*
      床合わせ用十字。
    */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      z-index: 17;
      pointer-events: none;
      opacity: 0.85;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      border-radius: 999px;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 42px;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 42px;
      height: 2px;
      transform: translateY(-50%);
    }

    /*
      画面全体の水中感。
      水位が目線を超えた時に少しだけ出す。
    */
    #globalUnderwater {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease-out;
      background:
        linear-gradient(
          to bottom,
          rgba(210, 245, 255, 0.02),
          rgba(120, 220, 255, 0.12) 45%,
          rgba(70, 190, 245, 0.18) 100%
        );
      backdrop-filter: blur(0.9px) saturate(1.05);
    }

    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 22;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 22;
      color: white;
      background: rgba(0, 28, 48, 0.82);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText,
    #scaleText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    button.sub {
      background: rgba(255,255,255,0.18);
    }

    #presetButtons,
    #floorButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.88;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.82;
      line-height: 1.45;
    }

    @keyframes causticsMove {
      0%   { transform: translateX(-20px) translateY(-8px); }
      50%  { transform: translateX(22px) translateY(10px); }
      100% { transform: translateX(-20px) translateY(-8px); }
    }

    @keyframes surfaceLineWave {
      0%   { transform: translateY(0) scaleY(1); }
      50%  { transform: translateY(2px) scaleY(1.12); }
      100% { transform: translateY(0) scaleY(1); }
    }

    @keyframes waveMoveA {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(26px) translateY(4px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMoveB {
      0%   { transform: translateX(0) translateY(0); }
      50%  { transform: translateX(-22px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes shineMove {
      0%   { transform: translateX(-22px); }
      100% { transform: translateX(22px); }
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="globalUnderwater"></div>

  <div id="underwaterArea"></div>

  <div id="waterSurfaceBand">
    <div class="surfaceGlass"></div>
    <div class="surfaceShine"></div>
    <div class="surfaceWave1"></div>
    <div class="surfaceWave2"></div>
    <div class="surfaceLine"></div>
  </div>

  <div id="floorLine"></div>
  <div id="floorLabel">床 0m</div>
  <div id="crosshair"></div>

  <div id="topBar">
    画面中央の十字を床・地面に合わせて「床を中央に設定」を押してください。<br>
    水面より上は通常、水面より下は淡い水色に染まって見えます。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">床基準 浸水深さWebAR</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="floorButtons">
      <button id="setFloorButton">床を中央に設定</button>
      <button id="floorUpButton" class="sub">床↑</button>
      <button id="floorDownButton" class="sub">床↓</button>
    </div>

    <div class="row">
      <label for="scaleSlider">表示スケール</label>
      <input id="scaleSlider" type="range" min="60" max="220" step="5" value="120" />
      <div id="scaleText">120</div>
    </div>

    <div id="debug">状態：カメラ起動前</div>

    <div id="basisInfo">
      基準：床0mを手動設定し、そこから指定した浸水高さの水面ラインを表示します。<br>
      ※ブラウザ版のため、実測床検出ではなく、体験者が指定した床基準から水位を計算します。
    </div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");

    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");

    const scaleSlider = document.getElementById("scaleSlider");
    const scaleText = document.getElementById("scaleText");

    const underwaterArea = document.getElementById("underwaterArea");
    const waterSurfaceBand = document.getElementById("waterSurfaceBand");
    const globalUnderwater = document.getElementById("globalUnderwater");

    const floorLine = document.getElementById("floorLine");
    const floorLabel = document.getElementById("floorLabel");

    const setFloorButton = document.getElementById("setFloorButton");
    const floorUpButton = document.getElementById("floorUpButton");
    const floorDownButton = document.getElementById("floorDownButton");

    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    let floorY = Math.round(window.innerHeight * 0.72);
    let pixelsPerMeter = parseFloat(scaleSlider.value);

    const EYE_HEIGHT_METERS = 1.5;

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateFloorVisual() {
      floorLine.style.top = floorY + "px";
      floorLabel.style.top = Math.max(8, floorY - 26) + "px";
    }

    function updateFloodHeight() {
      const h = parseFloat(heightSlider.value);
      pixelsPerMeter = parseFloat(scaleSlider.value);

      heightText.textContent = h.toFixed(1) + "m";
      scaleText.textContent = String(Math.round(pixelsPerMeter));

      let waterSurfaceY = floorY - h * pixelsPerMeter;
      waterSurfaceY = Math.max(40, Math.min(window.innerHeight - 40, waterSurfaceY));

      underwaterArea.style.top = waterSurfaceY + "px";
      waterSurfaceBand.style.top = (waterSurfaceY - 42) + "px";

      if (h <= EYE_HEIGHT_METERS) {
        globalUnderwater.style.opacity = "0";
      } else {
        const ratio = Math.min(1, (h - EYE_HEIGHT_METERS) / 2.5);
        const opacity = 0.06 + ratio * 0.20;
        globalUnderwater.style.opacity = opacity.toFixed(3);
      }

      updateFloorVisual();
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateFloodHeight();
    }

    function setFloorToCenter() {
      floorY = Math.round(window.innerHeight / 2);
      setDebug("床0mを画面中央に設定しました");
      updateFloodHeight();
    }

    function moveFloor(deltaPx) {
      floorY = Math.round(Math.max(40, Math.min(window.innerHeight - 40, floorY + deltaPx)));
      setDebug("床0mラインを調整しました");
      updateFloodHeight();
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 水面境界表現を表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    startButton.addEventListener("click", startCamera);

    heightSlider.addEventListener("input", updateFloodHeight);
    scaleSlider.addEventListener("input", updateFloodHeight);

    setFloorButton.addEventListener("click", setFloorToCenter);
    floorUpButton.addEventListener("click", () => moveFloor(-12));
    floorDownButton.addEventListener("click", () => moveFloor(12));

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    window.addEventListener("resize", () => {
      floorY = Math.round(Math.min(floorY, window.innerHeight - 40));
      updateFloodHeight();
    });

    updateFloorVisual();
    updateFloodHeight();
  </script>
</body>
</html>
