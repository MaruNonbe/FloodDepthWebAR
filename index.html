<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR - Two Point Calibration Stable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #111;
      z-index: 1;
    }

    #errorBox {
      position: fixed;
      left: 10px;
      right: 10px;
      top: 10px;
      z-index: 999;
      display: none;
      background: rgba(180, 0, 0, 0.86);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      white-space: pre-wrap;
    }

    #globalUnderwater {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(210,245,255,0.02),
          rgba(120,220,255,0.10),
          rgba(70,190,245,0.18)
        );
      backdrop-filter: blur(0.8px) saturate(1.05);
      transition: opacity 0.18s ease-out;
    }

#underwaterArea {
  position: fixed;
  left: 0;
  right: 0;
  top: 60%;
  bottom: 0;
  z-index: 5;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(110, 220, 255, 0.32),
      rgba(45, 185, 240, 0.52),
      rgba(0, 120, 200, 0.68)
    );
  backdrop-filter: blur(1px) saturate(1.08);
  overflow: hidden;
  transition: top 0.12s ease-out;
}

    #underwaterArea::before {
      content: "";
      position: absolute;
      inset: -20%;
      opacity: 0.35;
      background:
        repeating-linear-gradient(
          160deg,
          rgba(255,255,255,0) 0px,
          rgba(255,255,255,0) 28px,
          rgba(255,255,255,0.14) 34px,
          rgba(255,255,255,0) 48px
        );
      animation: causticsMove 7s linear infinite;
    }

    #waterSurfaceBand {
      position: fixed;
      left: 0;
      right: 0;
      height: 86px;
      top: calc(60% - 43px);
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
      transition: top 0.12s ease-out;
    }

    #waterSurfaceBand::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 22px;
      height: 42px;
      background:
        radial-gradient(
          ellipse at 50% 45%,
          rgba(255,255,255,0.36),
          rgba(255,255,255,0.12) 32%,
          rgba(255,255,255,0) 68%
        ),
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.08),
          rgba(120,220,255,0.16),
          rgba(80,190,235,0.08)
        );
      filter: blur(0.4px);
    }

    #waterSurfaceBand::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      top: 41px;
      height: 5px;
      background: rgba(245,255,255,0.96);
      border-radius: 999px;
      box-shadow:
        0 0 12px rgba(255,255,255,0.95),
        0 5px 18px rgba(150,230,255,0.86);
      animation: waterLineMove 3s ease-in-out infinite;
    }

    .waveA,
    .waveB {
      position: absolute;
      left: -12%;
      right: -12%;
      height: 34px;
      opacity: 0.76;
    }

    .waveA {
      top: 27px;
      background:
        radial-gradient(ellipse at 10% 55%, rgba(255,255,255,0.72), rgba(255,255,255,0) 58%),
        radial-gradient(ellipse at 30% 42%, rgba(255,255,255,0.52), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 55% 58%, rgba(255,255,255,0.68), rgba(255,255,255,0) 58%),
        radial-gradient(ellipse at 80% 48%, rgba(255,255,255,0.64), rgba(255,255,255,0) 60%);
      animation: waveMoveA 4s ease-in-out infinite;
    }

    .waveB {
      top: 36px;
      opacity: 0.42;
      background:
        radial-gradient(ellipse at 18% 50%, rgba(255,255,255,0.48), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 48% 48%, rgba(255,255,255,0.42), rgba(255,255,255,0) 60%),
        radial-gradient(ellipse at 74% 52%, rgba(255,255,255,0.48), rgba(255,255,255,0) 60%);
      animation: waveMoveB 5s ease-in-out infinite;
    }

    #floorLine,
    #refLine {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 16;
      pointer-events: none;
    }

    #floorLine {
      background: rgba(255, 230, 80, 0.88);
      box-shadow: 0 0 8px rgba(255,230,80,0.9);
    }

    #refLine {
      background: rgba(80, 255, 170, 0.88);
      box-shadow: 0 0 8px rgba(80,255,170,0.9);
    }

    #floorLabel,
    #refLabel {
      position: fixed;
      left: 12px;
      z-index: 17;
      pointer-events: none;
      background: rgba(0,0,0,0.48);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
    }

    #floorLabel {
      color: #fff4a0;
    }

    #refLabel {
      color: #a8ffd0;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      z-index: 17;
      pointer-events: none;
      opacity: 0.9;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 0 8px rgba(0,0,0,0.75);
      border-radius: 999px;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 42px;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 42px;
      height: 2px;
      transform: translateY(-50%);
    }

    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 22;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,25,45,0.70);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 22;
      color: white;
      background: rgba(0,28,48,0.84);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
      max-height: 54vh;
      overflow-y: auto;
    }

    #ui.panel-hidden {
      display: none;
    }

    #showPanelButton {
      position: fixed;
      right: 14px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 30;
      display: none;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      color: #fff;
      background: rgba(0, 140, 230, 0.92);
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }

    #showPanelButton.visible {
      display: block;
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText,
    #ppmText {
      min-width: 64px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    button.sub {
      background: rgba(255,255,255,0.18);
    }

    button.green {
      background: #00a86b;
    }

    button.yellow {
      background: #d7a800;
    }

    #presetButtons,
    #calibrationButtons,
    #adjustButtons,
    #panelButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.9;
    }

    #basisInfo {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.84;
      line-height: 1.45;
    }

    @keyframes waterLineMove {
      0% { transform: translateY(0); }
      50% { transform: translateY(2px); }
      100% { transform: translateY(0); }
    }

    @keyframes waveMoveA {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(26px) translateY(4px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes waveMoveB {
      0% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-22px) translateY(3px); }
      100% { transform: translateX(0) translateY(0); }
    }

    @keyframes causticsMove {
      0% { transform: translateX(-20px) translateY(-8px); }
      50% { transform: translateX(22px) translateY(10px); }
      100% { transform: translateX(-20px) translateY(-8px); }
    }
  </style>
</head>

<body>
  <div id="errorBox"></div>

  <video id="camera" autoplay playsinline muted></video>

  <div id="globalUnderwater"></div>

  <div id="underwaterArea"></div>

  <div id="waterSurfaceBand">
    <div class="waveA"></div>
    <div class="waveB"></div>
  </div>

  <div id="floorLine"></div>
  <div id="floorLabel">床 0m</div>

  <div id="refLine"></div>
  <div id="refLabel">2m基準</div>

  <div id="crosshair"></div>

  <div id="topBar">
    ①十字を床に合わせて「床0mを設定」<br>
    ②十字を2m高さに合わせて「2m基準を設定」<br>
    ③設定後は「設定パネルを隠す」で画面を広く使えます。
  </div>

  <button id="startButton">カメラを開始</button>
  <button id="showPanelButton">設定</button>

  <div id="ui">
    <div id="title">2点基準 浸水深さWebAR</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="2.0" />
      <div id="heightText">2.0m</div>
    </div>

    <div id="presetButtons">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="calibrationButtons">
      <button id="setFloorButton" class="yellow">床0mを設定</button>
      <button id="setRefButton" class="green">2m基準を設定</button>
    </div>

    <div id="adjustButtons">
      <button id="floorUpButton" class="sub">床↑</button>
      <button id="floorDownButton" class="sub">床↓</button>
      <button id="refUpButton" class="sub">2m↑</button>
      <button id="refDownButton" class="sub">2m↓</button>
    </div>

    <div class="row">
      <label>換算</label>
      <div style="width:100%; font-size:13px;">1mあたり</div>
      <div id="ppmText">120px</div>
    </div>

    <div id="debug">状態：ページ読込OK</div>

    <div id="panelButtons">
      <button id="hidePanelButton" class="sub">設定パネルを隠す</button>
    </div>

    <div id="basisInfo">
      床0mと2m基準の2点から、画面上の1mあたりの高さを自動計算します。<br>
      2.0mを押したとき、水面ラインが2m基準ラインと合うのが正しい動きです。<br>
      ※自動床検出ではなく、手動キャリブレーション方式です。
    </div>
  </div>

  <script>
    function showError(message) {
      const box = document.getElementById("errorBox");
      if (!box) return;
      box.style.display = "block";
      box.textContent = message;
    }

    window.addEventListener("error", function (event) {
      showError("JavaScript Error:\n" + event.message + "\nline: " + event.lineno);
    });

    window.addEventListener("unhandledrejection", function (event) {
      showError("Promise Error:\n" + event.reason);
    });

    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");

    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const ppmText = document.getElementById("ppmText");

    const underwaterArea = document.getElementById("underwaterArea");
    const waterSurfaceBand = document.getElementById("waterSurfaceBand");
    const globalUnderwater = document.getElementById("globalUnderwater");

    const floorLine = document.getElementById("floorLine");
    const floorLabel = document.getElementById("floorLabel");
    const refLine = document.getElementById("refLine");
    const refLabel = document.getElementById("refLabel");

    const setFloorButton = document.getElementById("setFloorButton");
    const setRefButton = document.getElementById("setRefButton");

    const floorUpButton = document.getElementById("floorUpButton");
    const floorDownButton = document.getElementById("floorDownButton");
    const refUpButton = document.getElementById("refUpButton");
    const refDownButton = document.getElementById("refDownButton");

    const hidePanelButton = document.getElementById("hidePanelButton");
    const showPanelButton = document.getElementById("showPanelButton");
    const uiPanel = document.getElementById("ui");

    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    let floorY = Math.round(window.innerHeight * 0.72);
    let ref2mY = Math.round(floorY - 240);

    const REF_HEIGHT_METERS = 2.0;
    const EYE_HEIGHT_METERS = 1.5;

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function getPixelsPerMeter() {
      const diff = floorY - ref2mY;
      if (diff <= 20) return 120;
      return diff / REF_HEIGHT_METERS;
    }

    function updateGuideLines() {
      floorLine.style.top = floorY + "px";
      floorLabel.style.top = Math.max(8, floorY - 26) + "px";

      refLine.style.top = ref2mY + "px";
      refLabel.style.top = Math.max(8, ref2mY - 26) + "px";

      ppmText.textContent = Math.round(getPixelsPerMeter()) + "px";
    }

    function updateFloodHeight() {
      const h = parseFloat(heightSlider.value);
      const ppm = getPixelsPerMeter();

      heightText.textContent = h.toFixed(1) + "m";
      ppmText.textContent = Math.round(ppm) + "px";

      let waterSurfaceY = floorY - h * ppm;
      waterSurfaceY = Math.max(40, Math.min(window.innerHeight - 40, waterSurfaceY));

      underwaterArea.style.top = waterSurfaceY + "px";
      waterSurfaceBand.style.top = (waterSurfaceY - 43) + "px";

      if (h <= EYE_HEIGHT_METERS) {
        globalUnderwater.style.opacity = "0";
      } else {
        const ratio = Math.min(1, (h - EYE_HEIGHT_METERS) / 2.5);
        const opacity = 0.06 + ratio * 0.20;
        globalUnderwater.style.opacity = opacity.toFixed(3);
      }

      updateGuideLines();
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateFloodHeight();
    }

    function hidePanel() {
      uiPanel.classList.add("panel-hidden");
      showPanelButton.classList.add("visible");
    }

    function showPanel() {
      uiPanel.classList.remove("panel-hidden");
      showPanelButton.classList.remove("visible");
      setDebug("設定パネルを再表示しました");
    }

    function setFloorToCenter() {
      floorY = Math.round(window.innerHeight / 2);

      if (ref2mY >= floorY - 40) {
        ref2mY = floorY - 240;
      }

      setDebug("床0mを画面中央に設定しました");
      updateFloodHeight();
    }

    function setRefToCenter() {
      ref2mY = Math.round(window.innerHeight / 2);

      if (ref2mY >= floorY - 40) {
        setDebug("2m基準が床0mに近すぎます。床より上に合わせてください");
        ref2mY = floorY - 120;
      } else {
        setDebug("2m基準を設定しました。パネルを非表示にします");
      }

      updateFloodHeight();

      setTimeout(function () {
        hidePanel();
      }, 800);
    }

    function moveFloor(deltaPx) {
      floorY = Math.round(Math.max(40, Math.min(window.innerHeight - 40, floorY + deltaPx)));

      if (ref2mY >= floorY - 40) {
        ref2mY = floorY - 240;
      }

      setDebug("床0mラインを調整しました");
      updateFloodHeight();
    }

    function moveRef(deltaPx) {
      ref2mY = Math.round(Math.max(40, Math.min(window.innerHeight - 40, ref2mY + deltaPx)));

      if (ref2mY >= floorY - 40) {
        ref2mY = floorY - 40;
      }

      setDebug("2m基準ラインを調整しました");
      updateFloodHeight();
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async function () {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 2点基準版を表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    startButton.addEventListener("click", startCamera);

    heightSlider.addEventListener("input", updateFloodHeight);

    setFloorButton.addEventListener("click", setFloorToCenter);
    setRefButton.addEventListener("click", setRefToCenter);

    floorUpButton.addEventListener("click", function () { moveFloor(-12); });
    floorDownButton.addEventListener("click", function () { moveFloor(12); });
    refUpButton.addEventListener("click", function () { moveRef(-12); });
    refDownButton.addEventListener("click", function () { moveRef(12); });

    demoLow.addEventListener("click", function () { setHeight(0.5); });
    demoMid.addEventListener("click", function () { setHeight(1.0); });
    demoHigh.addEventListener("click", function () { setHeight(2.0); });
    demoMax.addEventListener("click", function () { setHeight(3.0); });

    hidePanelButton.addEventListener("click", function () {
      hidePanel();
      setDebug("設定パネルを非表示にしました");
    });

    showPanelButton.addEventListener("click", showPanel);

    window.addEventListener("resize", function () {
      floorY = Math.round(Math.min(floorY, window.innerHeight - 40));
      ref2mY = Math.round(Math.max(40, Math.min(ref2mY, floorY - 40)));
      updateFloodHeight();
    });

    updateGuideLines();
    updateFloodHeight();
  </script>
</body>
</html>
