<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Flood Depth WebAR Simulator</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* 画面全体の淡い水色補正 */
    #blueTint {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: rgba(80, 200, 255, 0.08);
    }

    /* 水面以下の表現 */
    #waterLayer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20%;
      z-index: 5;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(150, 235, 255, 0.22) 0%,
          rgba(70, 200, 245, 0.38) 20%,
          rgba(20, 145, 210, 0.55) 100%
        );

      border-top: 3px solid rgba(240, 255, 255, 0.95);
      box-shadow:
        0 -8px 20px rgba(180, 240, 255, 0.55),
        inset 0 20px 35px rgba(255, 255, 255, 0.16);

      backdrop-filter: blur(1.2px) saturate(1.12);
      transition: height 0.18s ease-out;
      overflow: hidden;
    }

    /* 波の白い揺らぎ */
    #waterLayer::before {
      content: "";
      position: absolute;
      left: -25%;
      right: -25%;
      top: -22px;
      height: 46px;

      background:
        radial-gradient(ellipse at 10% 50%, rgba(255,255,255,0.9), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 30% 45%, rgba(255,255,255,0.65), rgba(255,255,255,0.0) 60%),
        radial-gradient(ellipse at 55% 55%, rgba(255,255,255,0.8), rgba(255,255,255,0.0) 58%),
        radial-gradient(ellipse at 80% 48%, rgba(255,255,255,0.72), rgba(255,255,255,0.0) 60%);

      opacity: 0.95;
      animation: waveMove 3.2s ease-in-out infinite;
    }

    /* 水中のゆらぎ線 */
    #waterLayer::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          165deg,
          rgba(255,255,255,0.0) 0px,
          rgba(255,255,255,0.0) 22px,
          rgba(255,255,255,0.16) 28px,
          rgba(255,255,255,0.0) 42px
        );

      opacity: 0.35;
      animation: shimmer 5.5s linear infinite;
    }

    @keyframes waveMove {
      0% {
        transform: translateX(0) translateY(0);
      }
      50% {
        transform: translateX(32px) translateY(5px);
      }
      100% {
        transform: translateX(0) translateY(0);
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-35px);
      }
      100% {
        transform: translateX(35px);
      }
    }

    #topBar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 25, 45, 0.68);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
    }

    #ui {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 20;
      color: white;
      background: rgba(0, 28, 48, 0.78);
      padding: 14px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }

    #title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    label {
      font-size: 14px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
    }

    #heightText {
      min-width: 62px;
      text-align: right;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      color: #fff;
      background: #008ee6;
      font-weight: 700;
      font-size: 14px;
    }

    #startButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      border: none;
      border-radius: 999px;
      padding: 16px 24px;
      background: #008ee6;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.42);
    }

    #startButton.hidden {
      display: none;
    }

    #debug {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>

  <div id="blueTint"></div>
  <div id="waterLayer"></div>

  <div id="topBar">
    スマホを周囲に向けてください。<br>
    浸水高さを変えると、画面内の水面ラインが上下します。
  </div>

  <button id="startButton">カメラを開始</button>

  <div id="ui">
    <div id="title">浸水深さWebARシミュレーション</div>

    <div class="row">
      <label for="heightSlider">浸水高さ</label>
      <input id="heightSlider" type="range" min="0" max="5" step="0.1" value="1.0" />
      <div id="heightText">1.0m</div>
    </div>

    <div class="row">
      <button id="demoLow">0.5m</button>
      <button id="demoMid">1.0m</button>
      <button id="demoHigh">2.0m</button>
      <button id="demoMax">3.0m</button>
    </div>

    <div id="debug">状態：カメラ起動前</div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const startButton = document.getElementById("startButton");
    const heightSlider = document.getElementById("heightSlider");
    const heightText = document.getElementById("heightText");
    const waterLayer = document.getElementById("waterLayer");
    const debug = document.getElementById("debug");

    const demoLow = document.getElementById("demoLow");
    const demoMid = document.getElementById("demoMid");
    const demoHigh = document.getElementById("demoHigh");
    const demoMax = document.getElementById("demoMax");

    function setDebug(message) {
      debug.textContent = "状態：" + message;
      console.log(message);
    }

    function updateWaterHeight() {
      const h = parseFloat(heightSlider.value);
      heightText.textContent = h.toFixed(1) + "m";

      /*
        試作版：
        0m〜5m を画面下からの高さに変換。
        5mで画面の約92%まで水が上がる。
      */
      const percent = Math.min(92, Math.max(0, h / 5 * 92));

      waterLayer.style.height = percent + "%";
    }

    async function startCamera() {
      try {
        setDebug("カメラ起動中...");

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setDebug("このブラウザではカメラAPIが使えません");
          alert("このブラウザではカメラAPIが使えません。SafariまたはChromeで開いてください。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = async () => {
          try {
            await video.play();
            startButton.classList.add("hidden");
            setDebug("カメラ起動OK / 水面表示中");
          } catch (e) {
            setDebug("video play失敗：" + e.name);
          }
        };

      } catch (error) {
        console.error(error);

        let message = "カメラ起動失敗：" + error.name;

        if (error.name === "NotAllowedError") {
          message = "カメラが許可されていません";
        } else if (error.name === "NotFoundError") {
          message = "カメラが見つかりません";
        } else if (location.protocol !== "https:" && location.hostname !== "localhost") {
          message = "HTTPSではないためカメラを起動できません";
        }

        setDebug(message);
        alert(message);
      }
    }

    function setHeight(value) {
      heightSlider.value = value;
      updateWaterHeight();
    }

    startButton.addEventListener("click", startCamera);
    heightSlider.addEventListener("input", updateWaterHeight);

    demoLow.addEventListener("click", () => setHeight(0.5));
    demoMid.addEventListener("click", () => setHeight(1.0));
    demoHigh.addEventListener("click", () => setHeight(2.0));
    demoMax.addEventListener("click", () => setHeight(3.0));

    updateWaterHeight();
  </script>
</body>
</html>
